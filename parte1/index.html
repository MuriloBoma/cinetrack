<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <title>CineTrack</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <h1><span class = "cine">Cine</span>Track</h1>
            <input type="search" aria-label="Buscar filme" placeholder="Buscar filme"> 
            <a href="adicionar.html"><button class="adicionar">+ <span class="sla">Adicionar</span></button></a>
        </header>

        <nav aria-label="Filtro de status">
            <button class="ativo">Todos</button>
            <button>Assistido</button>
            <button>Assistindo</button>
            <button>Quero assistir</button>
        </nav>

        <main>
            <section id="lista" aria-live="polite">
            </section>
        </main>

        <div id="modal" hidden>
            <div class="model-conteudo">
                <form id="form-filme">
                    <label for="titulo">Titulo<br><input id="titulo" type="text"></label>

                    <br><br>

                    <label for="ano">Ano<br><input id="ano" type="number" min="1888" max="2030"></label>

                    <br><br>

                    <label for="genero">Gênero<br><input id="genero" type="text"></label>

                    <br><br>

                    <label for="url">URL do pôster<br><input id="url" type="url"></label>

                    <br><br>
                    
                    <label for="status">Status
                        <br>
                        <select id="status">
                            <option>Quero assistir</option>
                        </select>
                    </label>

                    <br><br>

                    <label for="nota">Nota (1 a 5)<br><input id="nota" type="number" min="1" max="5"></label>
                    
                    <br><br>

                    <label for="comentario">Comentário<br><textarea id="comentario"></textarea></label>
                    
                    <br><br>

                    <button type="button">Cancelar</button>
                    <button type="submit">Salvar</button>
                </form>
            </div>
        </div>
        
        <footer>
            <p>CineTrack - UEM</p>
        </footer>
        <script src="app.js"></script>
    </body>
</html>
